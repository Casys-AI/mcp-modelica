<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modelica simulation results</title>
    <style>
    :root {
  color-scheme: light dark;
  --modelica-text: var(--mcp-view-text, #f4efe7);
  --modelica-muted: var(--mcp-view-muted, #a99c8f);
  --modelica-border: var(--mcp-view-border, rgba(150, 135, 120, 0.24));
  --modelica-subtle: var(--mcp-view-subtle, rgba(128, 112, 95, 0.09));
  --modelica-accent: var(--mcp-view-accent, #e49a53);
  --modelica-brand: var(--color-brand, #9c6ec2);
  --modelica-success: var(--mcp-view-success, #62d99a);
  --modelica-warning: var(--mcp-view-warning, #f6c453);
  --modelica-danger: var(--mcp-view-danger, #ef7b72);
  --modelica-mono: var(--font-mono, ui-monospace, "SFMono-Regular", Menlo, monospace);
}

html,
body {
  min-width: 0;
  margin: 0;
  background: transparent;
  color: var(--modelica-text);
}

body {
  font: 14px/1.5 var(--font-sans, ui-sans-serif, system-ui, sans-serif);
  font-variant-numeric: tabular-nums;
}
button {
  font: inherit;
}

#root {
  width: 100%;
  min-width: 0;
  margin: 0;
  padding: 0.65rem;
  container: modelica-view / inline-size;
}

.modelica-shell {
  min-width: 0;
  overflow: hidden;
}

.modelica-shell::before {
  display: block;
  height: 2px;
  background: linear-gradient(90deg, var(--modelica-accent), var(--modelica-brand));
  content: "";
}

.modelica-component-only {
  overflow: visible;
}

.component-surface-host {
  padding: 0.85rem;
}
.modelica-component-only .component-surface-host {
  padding: 0;
}

.modelica-run-time,
.modelica-muted {
  margin: 0;
  color: var(--modelica-muted);
  font-size: 0.75rem;
}

.modelica-run-time {
  overflow-wrap: anywhere;
}

.modelica-path-bar-host {
  min-width: 0;
}

.modelica-shell > .modelica-path-bar-host {
  margin: 0.65rem 0.85rem 0;
}

.modelica-run-list {
  display: grid;
  gap: 0;
  min-width: 0;
}

.modelica-run-list .mcp-view-semantic-element[data-density="row"] + .mcp-view-semantic-element[data-density="row"] {
  border-top: 0;
}

.mcp-view-key-value code,
.mcp-view-table code,
.mcp-view-element-provenance-value code {
  overflow-wrap: anywhere;
  color: var(--modelica-text);
  font: 0.7rem/1.4 var(--modelica-mono);
}

.modelica-notes {
  margin: 0;
  padding-left: 1.1rem;
  color: var(--modelica-muted);
  text-align: left;
}

.modelica-shell > .mcp-view-state {
  min-height: 11rem;
}

.modelica-recorded-state {
  display: flex;
  min-height: 9rem;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  padding: 1rem;
  border: 1px solid var(--modelica-border);
  border-radius: 0.55rem;
  background: var(--modelica-subtle);
  text-align: left;
}

.modelica-recorded-state code {
  color: var(--modelica-text);
  font: 600 0.72rem/1.3 var(--modelica-mono);
  letter-spacing: 0.06em;
}

.modelica-recorded-state-dot {
  width: 0.45rem;
  height: 0.45rem;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--modelica-muted);
}

.modelica-recorded-state[data-status="pending"] .modelica-recorded-state-dot,
.modelica-recorded-state[data-status="running"] .modelica-recorded-state-dot {
  background: var(--modelica-accent);
}

.modelica-recorded-state[data-status="running"] .modelica-recorded-state-dot {
  animation: recorded-pulse 1.4s ease-in-out infinite;
}

.modelica-recorded-state[data-status="rejected"] .modelica-recorded-state-dot {
  background: var(--modelica-danger);
}

.modelica-recorded-state[data-status="recovery_required"] .modelica-recorded-state-dot {
  background: var(--modelica-warning);
}

.spinner {
  width: 1.5rem;
  height: 1.5rem;
  border: 3px solid var(--modelica-border);
  border-top-color: var(--modelica-accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(1turn);
  }
}

@keyframes recorded-pulse {
  50% {
    opacity: 0.35;
  }
}

@container modelica-view (max-width: 440px) {
  .component-surface-host {
    padding: 0.55rem;
  }
  .modelica-component-only .component-surface-host {
    padding: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .spinner,
  .modelica-recorded-state[data-status="running"] .modelica-recorded-state-dot {
    animation: none;
  }
}

.mcp-view-semantic-element[data-density="card"] .mcp-view-element-verdict {
  grid-column: 2;
  grid-row: 1;
  text-align: right;
}
.mcp-view-semantic-element[data-density="card"] .mcp-view-element-reading {
  grid-column: 1 / -1;
  padding-block: 0.65rem;
  border-block: 1px solid var(--mcp-view-border);
}
.mcp-view-semantic-element[data-density="card"] .mcp-view-element-body {
  grid-column: 1 / -1;
}
.mcp-view-semantic-element[data-density="card"] .mcp-view-element-reading-value {
  font-size: 1.35rem;
}
.mcp-view-semantic-element[data-density="card"] .mcp-view-element-provenance {
  grid-column: 1 / -1;
}

@container (max-width: 440px) {
  .mcp-view-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mcp-view-row-responsive { align-items: flex-start; flex-direction: column; }
  .mcp-view-card-header { align-items: stretch; flex-direction: column; }
  .mcp-view-card-actions { justify-content: flex-start; }
  .mcp-view-key-value { grid-template-columns: 1fr; gap: 0.2rem; }
  .mcp-view-key-value dd { text-align: left; }
  .mcp-view-limit-gauge {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "label reading"
      "track track"
      "limit status";
  }
  .mcp-view-artifact-row { grid-template-columns: minmax(0, 1fr) auto; }
  .mcp-view-artifact-row-identity,
  .mcp-view-artifact-row-uri,
  .mcp-view-artifact-row-fingerprint { grid-column: 1; }
  .mcp-view-artifact-row-size,
  .mcp-view-artifact-row-verification { grid-column: 2; }
  .mcp-view-semantic-element[data-density="row"] {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .mcp-view-semantic-element[data-density="row"] .mcp-view-element-reading,
  .mcp-view-semantic-element[data-density="row"] .mcp-view-element-provenance {
    grid-column: 1 / -1;
  }
  .mcp-view-semantic-element[data-density="row"] .mcp-view-element-provenance {
    justify-self: start;
  }
}
