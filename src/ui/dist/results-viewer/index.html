<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modelica simulation results</title>
    <style>
    :root {
  color-scheme: light dark;
  --surface: var(--color-background-primary, #101614);
  --panel: var(--color-background-secondary, #17201d);
  --panel-deep: var(--color-background-tertiary, #0c1110);
  --text: var(--color-text-primary, #e8eee8);
  --muted: var(--color-text-secondary, #9daaa2);
  --line: var(--color-border-primary, #3c4a42);
  --accent: var(--color-accent, #d5b665);
  --ok: #66bd8d;
  --warn: #e5a65d;
  --danger: #e17870;
  --font-body: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
  --font-data: var(--font-mono, ui-monospace, "SFMono-Regular", Menlo, monospace);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-width: 0;
  background: var(--surface);
  color: var(--text);
}
body {
  font: 14px/1.5 var(--font-body);
}
button {
  font: inherit;
}

#root {
  max-width: 1160px;
  margin: 0 auto;
  padding: 18px;
}
.instrument {
  border: 1px solid var(--line);
  background: var(--panel-deep);
  box-shadow: 0 18px 50px rgb(0 0 0 / 20%);
}
.masthead {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px 17px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(115deg, color-mix(in srgb, var(--panel) 94%, var(--accent)),
    var(--panel-deep) 64%);
}
.kicker,
.eyebrow {
  margin: 0 0 3px;
  color: var(--accent);
  font: 700 11px/1.2 var(--font-data);
  letter-spacing: .13em;
}
h1,
h2,
p {
  margin-top: 0;
}
h1 {
  margin-bottom: 0;
  font: 700 clamp(20px, 4vw, 32px)/1.1 var(--font-body);
  letter-spacing: -.03em;
}
h2 {
  margin-bottom: 12px;
  font-size: 15px;
}
.readout {
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 65%, var(--line));
  padding: 4px 8px;
  font: 700 10px var(--font-data);
  letter-spacing: .1em;
}
.lede,
.run-header,
.panel,
.state,
.table-wrap {
  margin: 18px 22px;
}
.lede,
.run-time,
.empty-copy {
  color: var(--muted);
}
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
}
table {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
}
th,
td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: middle;
}
tr:last-child td {
  border-bottom: 0;
}
th {
  color: var(--muted);
  background: var(--panel);
  font: 700 10px var(--font-data);
  text-transform: uppercase;
  letter-spacing: .08em;
}
td {
  font-family: var(--font-data);
  font-size: 12px;
}
.run-link,
.back {
  border: 0;
  color: var(--accent);
  background: transparent;
  padding: 0;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  font-family: var(--font-data);
}
.run-link:hover,
.back:hover {
  color: var(--text);
}
.run-link:focus-visible,
.back:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.status {
  display: inline-block;
  border: 1px solid currentColor;
  padding: 2px 6px;
  font: 700 10px var(--font-data);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.status-succeeded {
  color: var(--ok);
}
.status-failed {
  color: var(--danger);
}
.status-timed_out {
  color: var(--warn);
}
.run-header {
  display: flex;
  align-items: start;
  gap: 14px;
  padding: 14px 0 2px;
  border-bottom: 1px solid var(--line);
}
.run-header > div {
  flex: 1;
  min-width: 0;
}
.run-header h2 {
  margin: 0 0 5px;
  overflow-wrap: anywhere;
  font-family: var(--font-data);
  font-size: 16px;
}
.run-time {
  margin-bottom: 12px;
  font-size: 12px;
}
.back {
  margin-top: 3px;
  white-space: nowrap;
}
.panel {
  padding: 15px;
  border: 1px solid var(--line);
  background: var(--panel);
}
.panel h2 {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 14px;
}
.panel h2 span {
  color: var(--accent);
  font-family: var(--font-data);
}
.quantity-grid,
.fact-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin: 0;
}
.quantity-grid div,
.fact-grid div {
  min-width: 0;
  border-left: 2px solid var(--line);
  padding-left: 9px;
}
dt {
  color: var(--muted);
  font-size: 11px;
}
dd {
  margin: 2px 0 0;
  overflow-wrap: anywhere;
  font-family: var(--font-data);
  font-size: 12px;
}
code {
  font-family: var(--font-data);
  font-size: 11px;
  overflow-wrap: anywhere;
}
.artifact-list {
  display: grid;
  gap: 8px;
}
.artifact {
  padding: 11px;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel-deep) 72%, var(--panel));
}
.artifact > div {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}
.artifact strong {
  color: var(--accent);
  font: 700 11px var(--font-data);
  text-transform: uppercase;
}
.artifact span {
  color: var(--muted);
  font: 11px var(--font-data);
}
.artifact > code {
  display: block;
  color: var(--text);
  margin-bottom: 7px;
}
.artifact dl {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 6px;
  margin: 0;
}
.warnings {
  border-color: color-mix(in srgb, var(--warn) 55%, var(--line));
}
.warnings ul {
  margin: 0;
  padding-left: 18px;
  color: var(--muted);
}
.state {
  min-height: 180px;
  display: grid;
  place-content: center;
  justify-items: center;
  text-align: center;
  padding: 26px;
}
.state p {
  max-width: 48ch;
  margin-bottom: 0;
  color: var(--muted);
}
.state.error {
  border: 1px solid color-mix(in srgb, var(--danger) 58%, var(--line));
  background: color-mix(in srgb, var(--danger) 9%, var(--panel));
}
.state.error h2,
.state.error h1 {
  color: var(--danger);
}
.spinner {
  width: 24px;
  height: 24px;
  margin-bottom: 12px;
  border: 3px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (max-width: 560px) {
  #root {
    padding: 0;
  }
  .instrument {
    border-inline: 0;
  }
  .masthead {
    align-items: start;
    padding: 16px;
  }
  .readout {
    display: none;
  }
  .lede,
  .run-header,
  .panel,
  .state,
  .table-wrap {
    margin-inline: 16px;
  }
  .run-header {
    flex-wrap: wrap;
  }
  .run-header .status {
    margin-left: auto;
  }
}

@media (prefers-reduced-motion: reduce) {
  .spinner {
    animation: none;
  }
}

    </style>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modelica simulation results</title>
    <style>
    :root {
  color-scheme: light dark;
  --surface: var(--color-background-primary, #101614);
  --panel: var(--color-background-secondary, #17201d);
  --panel-deep: var(--color-background-tertiary, #0c1110);
  --text: var(--color-text-primary, #e8eee8);
  --muted: var(--color-text-secondary, #9daaa2);
  --line: var(--color-border-primary, #3c4a42);
  --accent: var(--color-accent, #d5b665);
  --ok: #66bd8d;
  --warn: #e5a65d;
  --danger: #e17870;
  --font-body: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
  --font-data: var(--font-mono, ui-monospace, "SFMono-Regular", Menlo, monospace);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-width: 0;
  background: var(--surface);
  color: var(--text);
}
body {
  font: 14px/1.5 var(--font-body);
}
button {
  font: inherit;
}

#root {
  max-width: 1160px;
  margin: 0 auto;
  padding: 18px;
}
.instrument {
  border: 1px solid var(--line);
  background: var(--panel-deep);
  box-shadow: 0 18px 50px rgb(0 0 0 / 20%);
}
.masthead {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px 17px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(115deg, color-mix(in srgb, var(--panel) 94%, var(--accent)),
    var(--panel-deep) 64%);
}
.kicker,
.eyebrow {
  margin: 0 0 3px;
  color: var(--accent);
  font: 700 11px/1.2 var(--font-data);
  letter-spacing: .13em;
}
h1,
h2,
p {
  margin-top: 0;
}
h1 {
  margin-bottom: 0;
  font: 700 clamp(20px, 4vw, 32px)/1.1 var(--font-body);
  letter-spacing: -.03em;
}
h2 {
  margin-bottom: 12px;
  font-size: 15px;
}
.readout {
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 65%, var(--line));
  padding: 4px 8px;
  font: 700 10px var(--font-data);
  letter-spacing: .1em;
}
.lede,
.run-header,
.panel,
.state,
.table-wrap {
  margin: 18px 22px;
}
.lede,
.run-time,
.empty-copy {
  color: var(--muted);
}
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
}
table {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
}
th,
td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: middle;
}
tr:last-child td {
  border-bottom: 0;
}
th {
  color: var(--muted);
  background: var(--panel);
  font: 700 10px var(--font-data);
  text-transform: uppercase;
  letter-spacing: .08em;
}
td {
  font-family: var(--font-data);
  font-size: 12px;
}
.run-link,
.back {
  border: 0;
  color: var(--accent);
  background: transparent;
  padding: 0;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  font-family: var(--font-data);
}
.run-link:hover,
.back:hover {
  color: var(--text);
}
.run-link:focus-visible,
.back:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.status {
  display: inline-block;
  border: 1px solid currentColor;
  padding: 2px 6px;
  font: 700 10px var(--font-data);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.status-succeeded {
  color: var(--ok);
}
.status-failed {
  color: var(--danger);
}
.status-timed_out {
  color: var(--warn);
}
.run-header {
  display: flex;
  align-items: start;
  gap: 14px;
  padding: 14px 0 2px;
  border-bottom: 1px solid var(--line);
}
.run-header > div {
  flex: 1;
  min-width: 0;
}
.run-header h2 {
  margin: 0 0 5px;
  overflow-wrap: anywhere;
  font-family: var(--font-data);
  font-size: 16px;
}
.run-time {
  margin-bottom: 12px;
  font-size: 12px;
}
.back {
  margin-top: 3px;
  white-space: nowrap;
}
.panel {
  padding: 15px;
  border: 1px solid var(--line);
  background: var(--panel);
}
.panel h2 {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 14px;
}
.panel h2 span {
  color: var(--accent);
  font-family: var(--font-data);
}
.quantity-grid,
.fact-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin: 0;
}
.quantity-grid div,
.fact-grid div {
  min-width: 0;
  border-left: 2px solid var(--line);
  padding-left: 9px;
}
dt {
  color: var(--muted);
  font-size: 11px;
}
dd {
  margin: 2px 0 0;
  overflow-wrap: anywhere;
  font-family: var(--font-data);
  font-size: 12px;
}
code {
  font-family: var(--font-data);
  font-size: 11px;
  overflow-wrap: anywhere;
}
.artifact-list {
  display: grid;
  gap: 8px;
}
.artifact {
  padding: 11px;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel-deep) 72%, var(--panel));
}
.artifact > div {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}
.artifact strong {
  color: var(--accent);
  font: 700 11px var(--font-data);
  text-transform: uppercase;
}
.artifact span {
  color: var(--muted);
  font: 11px var(--font-data);
}
.artifact > code {
  display: block;
  color: var(--text);
  margin-bottom: 7px;
}
.artifact dl {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 6px;
  margin: 0;
}
.warnings {
  border-color: color-mix(in srgb, var(--warn) 55%, var(--line));
}
.warnings ul {
  margin: 0;
  padding-left: 18px;
  color: var(--muted);
}
.state {
  min-height: 180px;
  display: grid;
  place-content: center;
  justify-items: center;
  text-align: center;
  padding: 26px;
}
.state p {
  max-width: 48ch;
  margin-bottom: 0;
  color: var(--muted);
}
.state.error {
  border: 1px solid color-mix(in srgb, var(--danger) 58%, var(--line));
  background: color-mix(in srgb, var(--danger) 9%, var(--panel));
}
.state.error h2,
.state.error h1 {
  color: var(--danger);
}
.spinner {
  width: 24px;
  height: 24px;
  margin-bottom: 12px;
  border: 3px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (max-width: 560px) {
  #root {
    padding: 0;
  }
  .instrument {
    border-inline: 0;
  }
  .masthead {
    align-items: start;
    padding: 16px;
  }
  .readout {
    display: none;
  }
  .lede,
  .run-header,
  .panel,
  .state,
  .table-wrap {
    margin-inline: 16px;
  }
  .run-header {
    flex-wrap: wrap;
  }
  .run-header .status {
    margin-left: auto;
  }
}

@media (prefers-reduced-motion: reduce) {
  .spinner {
    animation: none;
  }
}

    </style>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modelica simulation results</title>
    <style>
    :root {
  color-scheme: light dark;
  --surface: var(--color-background-primary, #101614);
  --panel: var(--color-background-secondary, #17201d);
  --panel-deep: var(--color-background-tertiary, #0c1110);
  --text: var(--color-text-primary, #e8eee8);
  --muted: var(--color-text-secondary, #9daaa2);
  --line: var(--color-border-primary, #3c4a42);
  --accent: var(--color-accent, #d5b665);
  --ok: #66bd8d;
  --warn: #e5a65d;
  --danger: #e17870;
  --font-body: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
  --font-data: var(--font-mono, ui-monospace, "SFMono-Regular", Menlo, monospace);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-width: 0;
  background: var(--surface);
  color: var(--text);
}
body {
  font: 14px/1.5 var(--font-body);
}
button {
  font: inherit;
}

#root {
  max-width: 1160px;
  margin: 0 auto;
  padding: 18px;
}
.instrument {
  border: 1px solid var(--line);
  background: var(--panel-deep);
  box-shadow: 0 18px 50px rgb(0 0 0 / 20%);
}
.masthead {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px 17px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(115deg, color-mix(in srgb, var(--panel) 94%, var(--accent)),
    var(--panel-deep) 64%);
}
.kicker,
.eyebrow {
  margin: 0 0 3px;
  color: var(--accent);
  font: 700 11px/1.2 var(--font-data);
  letter-spacing: .13em;
}
h1,
h2,
p {
  margin-top: 0;
}
h1 {
  margin-bottom: 0;
  font: 700 clamp(20px, 4vw, 32px)/1.1 var(--font-body);
  letter-spacing: -.03em;
}
h2 {
  margin-bottom: 12px;
  font-size: 15px;
}
.readout {
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 65%, var(--line));
  padding: 4px 8px;
  font: 700 10px var(--font-data);
  letter-spacing: .1em;
}
.lede,
.run-header,
.panel,
.state,
.table-wrap {
  margin: 18px 22px;
}
.lede,
.run-time,
.empty-copy {
  color: var(--muted);
}
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
}
table {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
}
th,
td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: middle;
}
tr:last-child td {
  border-bottom: 0;
}
th {
  color: var(--muted);
  background: var(--panel);
  font: 700 10px var(--font-data);
  text-transform: uppercase;
  letter-spacing: .08em;
}
td {
  font-family: var(--font-data);
  font-size: 12px;
}
.run-link,
.back {
  border: 0;
  color: var(--accent);
  background: transparent;
  padding: 0;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  font-family: var(--font-data);
}
.run-link:hover,
.back:hover {
  color: var(--text);
}
.run-link:focus-visible,
.back:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.status {
  display: inline-block;
  border: 1px solid currentColor;
  padding: 2px 6px;
  font: 700 10px var(--font-data);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.status-succeeded {
  color: var(--ok);
}
.status-failed {
  color: var(--danger);
}
.status-timed_out {
  color: var(--warn);
}
.run-header {
  display: flex;
  align-items: start;
  gap: 14px;
  padding: 14px 0 2px;
  border-bottom: 1px solid var(--line);
}
.run-header > div {
  flex: 1;
  min-width: 0;
}
.run-header h2 {
  margin: 0 0 5px;
  overflow-wrap: anywhere;
  font-family: var(--font-data);
  font-size: 16px;
}
.run-time {
  margin-bottom: 12px;
  font-size: 12px;
}
.back {
  margin-top: 3px;
  white-space: nowrap;
}
.panel {
  padding: 15px;
  border: 1px solid var(--line);
  background: var(--panel);
}
.panel h2 {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 14px;
}
.panel h2 span {
  color: var(--accent);
  font-family: var(--font-data);
}
.quantity-grid,
.fact-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin: 0;
}
.quantity-grid div,
.fact-grid div {
  min-width: 0;
  border-left: 2px solid var(--line);
  padding-left: 9px;
}
dt {
  color: var(--muted);
  font-size: 11px;
}
dd {
  margin: 2px 0 0;
  overflow-wrap: anywhere;
  font-family: var(--font-data);
  font-size: 12px;
}
code {
  font-family: var(--font-data);
  font-size: 11px;
  overflow-wrap: anywhere;
}
.artifact-list {
  display: grid;
  gap: 8px;
}
.artifact {
  padding: 11px;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel-deep) 72%, var(--panel));
}
.artifact > div {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}
.artifact strong {
  color: var(--accent);
  font: 700 11px var(--font-data);
  text-transform: uppercase;
}
.artifact span {
  color: var(--muted);
  font: 11px var(--font-data);
}
.artifact > code {
  display: block;
  color: var(--text);
  margin-bottom: 7px;
}
.artifact dl {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 6px;
  margin: 0;
}
.warnings {
  border-color: color-mix(in srgb, var(--warn) 55%, var(--line));
}
.warnings ul {
  margin: 0;
  padding-left: 18px;
  color: var(--muted);
}
.state {
  min-height: 180px;
  display: grid;
  place-content: center;
  justify-items: center;
  text-align: center;
  padding: 26px;
}
.state p {
  max-width: 48ch;
  margin-bottom: 0;
  color: var(--muted);
}
.state.error {
  border: 1px solid color-mix(in srgb, var(--danger) 58%, var(--line));
  background: color-mix(in srgb, var(--danger) 9%, var(--panel));
}
.state.error h2,
.state.error h1 {
  color: var(--danger);
}
.spinner {
  width: 24px;
  height: 24px;
  margin-bottom: 12px;
  border: 3px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (max-width: 560px) {
  #root {
    padding: 0;
  }
  .instrument {
    border-inline: 0;
  }
  .masthead {
    align-items: start;
    padding: 16px;
  }
  .readout {
    display: none;
  }
  .lede,
  .run-header,
  .panel,
  .state,
  .table-wrap {
    margin-inline: 16px;
  }
  .run-header {
    flex-wrap: wrap;
  }
  .run-header .status {
    margin-left: auto;
  }
}

@media (prefers-reduced-motion: reduce) {
  .spinner {
    animation: none;
  }
}

    </style>
  </head>

p {

}

  margin-bottom: 0;

}
h2 {
  margin-bottom: 12px;
  font-size: 15px;
}
.readout {
  color: var(--accent);

}

}

}

  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
}
th,
td {
  padding: 11px 12px;

  text-align: left;
  vertical-align: middle;
}
tr:last-child td {
  border-bottom: 0;
}
th {
  color: var(--muted);
  background: var(--panel);
  font: 700 10px var(--font-data);
  text-transform: uppercase;
  letter-spacing: .08em;
}
td {
  font-family: var(--font-data);
  font-size: 12px;
}
.run-link,
.back {
  border: 0;
  color: var(--accent);
  background: transparent;

  text-underline-offset: 3px;
  cursor: pointer;
  font-family: var(--font-data);
}
.run-link:hover,
.back:hover {
  color: var(--text);
}
.run-link:focus-visible,
.back:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.status {
  display: inline-block;
  border: 1px solid currentColor;
  padding: 2px 6px;
  font: 700 10px var(--font-data);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.status-succeeded {
  color: var(--ok);
}
.status-failed {
  color: var(--danger);
}
.status-timed_out {
  color: var(--warn);
}
.run-header {
  display: flex;
  align-items: start;
  gap: 14px;
  padding: 14px 0 2px;
  border-bottom: 1px solid var(--line);
}
.run-header > div {
  flex: 1;
  min-width: 0;
}
.run-header h2 {
  margin: 0 0 5px;
  overflow-wrap: anywhere;
  font-family: var(--font-data);
  font-size: 16px;
}
.run-time {
  margin-bottom: 12px;
  font-size: 12px;
}
.back {
  margin-top: 3px;
  white-space: nowrap;
}
.panel {
  padding: 15px;
  border: 1px solid var(--line);
  background: var(--panel);
}
.panel h2 {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 14px;
}
.panel h2 span {
  color: var(--accent);
  font-family: var(--font-data);
}
.quantity-grid,
.fact-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin: 0;
}
.quantity-grid div,
.fact-grid div {
  min-width: 0;
  border-left: 2px solid var(--line);
  padding-left: 9px;
}
dt {
  color: var(--muted);
  font-size: 11px;
}
dd {
  margin: 2px 0 0;
  overflow-wrap: anywhere;
  font-family: var(--font-data);
  font-size: 12px;
}
code {
  font-family: var(--font-data);
  font-size: 11px;
  overflow-wrap: anywhere;
}
.artifact-list {
  display: grid;
  gap: 8px;
}
.artifact {
  padding: 11px;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel-deep) 72%, var(--panel));
}
.artifact > div {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}
.artifact strong {
  color: var(--accent);
  font: 700 11px var(--font-data);
  text-transform: uppercase;
}
.artifact span {
  color: var(--muted);
  font: 11px var(--font-data);
}
.artifact > code {
  display: block;
  color: var(--text);
  margin-bottom: 7px;
}
.artifact dl {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 6px;
  margin: 0;
}
.warnings {
  border-color: color-mix(in srgb, var(--warn) 55%, var(--line));
}
.warnings ul {
  margin: 0;
  padding-left: 18px;
  color: var(--muted);
}
.state {
  min-height: 180px;
  display: grid;
  place-content: center;
  justify-items: center;
  text-align: center;
  padding: 26px;
}
.state p {
  max-width: 48ch;
  margin-bottom: 0;
  color: var(--muted);
}
.state.error {
  border: 1px solid color-mix(in srgb, var(--danger) 58%, var(--line));
  background: color-mix(in srgb, var(--danger) 9%, var(--panel));
}
.state.error h2,
.state.error h1 {
  color: var(--danger);
}
.spinner {
  width: 24px;
  height: 24px;
  margin-bottom: 12px;
  border: 3px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (max-width: 560px) {
  #root {
    padding: 0;
  }
  .instrument {
    border-inline: 0;
  }
  .masthead {
    align-items: start;
    padding: 16px;
  }
  .readout {
    display: none;
  }
  .lede,
  .run-header,
  .panel,
  .state,
  .table-wrap {
    margin-inline: 16px;
  }
  .run-header {
    flex-wrap: wrap;
  }
  .run-header .status {
    margin-left: auto;
  }
}

@media (prefers-reduced-motion: reduce) {
  .spinner {
    animation: none;
  }
}
