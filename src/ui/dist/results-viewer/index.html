<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modelica simulation results</title>
    <style>
    :root {
  color-scheme: light dark;
  --modelica-text: var(--mcp-view-text, #f4efe7);
  --modelica-muted: var(--mcp-view-muted, #a99c8f);
  --modelica-border: var(--mcp-view-border, rgba(150, 135, 120, 0.24));
  --modelica-subtle: var(--mcp-view-subtle, rgba(128, 112, 95, 0.09));
  --modelica-accent: var(--mcp-view-accent, #e49a53);
  --modelica-brand: var(--color-brand, #9c6ec2);
  --modelica-success: var(--mcp-view-success, #62d99a);
  --modelica-warning: var(--mcp-view-warning, #f6c453);
  --modelica-danger: var(--mcp-view-danger, #ef7b72);
  --modelica-mono: var(--font-mono, ui-monospace, "SFMono-Regular", Menlo, monospace);
}

html,
body {
  min-width: 0;
  margin: 0;
  background: transparent;
  color: var(--modelica-text);
}

body {
  font: 14px/1.5 var(--font-sans, ui-sans-serif, system-ui, sans-serif);
  font-variant-numeric: tabular-nums;
}
button {
  font: inherit;
}

#root {
  width: 100%;
  min-width: 0;
  margin: 0;
  padding: 0.65rem;
  container: modelica-view / inline-size;
}

.modelica-shell {
  min-width: 0;
  overflow: hidden;
}

.modelica-shell::before {
  display: block;
  height: 2px;
  background: linear-gradient(90deg, var(--modelica-accent), var(--modelica-brand));
  content: "";
}

.modelica-component-only {
  overflow: visible;
}

.component-surface-host {
  padding: 0.85rem;
}
.modelica-component-only .component-surface-host {
  padding: 0;
}

.modelica-run-time,
.modelica-muted {
  margin: 0;
  color: var(--modelica-muted);
  font-size: 0.75rem;
}

.modelica-run-time {
  overflow-wrap: anywhere;
}

.modelica-artifact {
  display: grid;
  gap: 0.55rem;
  min-width: 0;
  padding: 0.65rem;
  border: 1px solid var(--modelica-border);
  border-radius: 0.55rem;
  background: var(--modelica-subtle);
}

.modelica-artifact-summary {
  padding: 0;
  background: transparent;
}

.modelica-artifact > code,
.modelica-artifact dd code,
.mcp-view-key-value code,
.mcp-view-table code {
  overflow-wrap: anywhere;
  color: var(--modelica-text);
  font: 0.7rem/1.4 var(--modelica-mono);
}

.modelica-notes {
  margin: 0;
  padding-left: 1.1rem;
  color: var(--modelica-muted);
  text-align: left;
}

.modelica-shell > .mcp-view-state {
  min-height: 11rem;
}

.modelica-recorded-state {
  display: flex;
  min-height: 9rem;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  padding: 1rem;
  border: 1px solid var(--modelica-border);
  border-radius: 0.55rem;
  background: var(--modelica-subtle);
  text-align: left;
}

.modelica-recorded-state code {
  color: var(--modelica-text);
  font: 600 0.72rem/1.3 var(--modelica-mono);
  letter-spacing: 0.06em;
}

.modelica-recorded-state-dot {
  width: 0.45rem;
  height: 0.45rem;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--modelica-muted);
}

.modelica-recorded-state[data-status="pending"] .modelica-recorded-state-dot,
.modelica-recorded-state[data-status="running"] .modelica-recorded-state-dot {
  background: var(--modelica-accent);
}

.modelica-recorded-state[data-status="running"] .modelica-recorded-state-dot {
  animation: recorded-pulse 1.4s ease-in-out infinite;
}

.modelica-recorded-state[data-status="rejected"] .modelica-recorded-state-dot {
  background: var(--modelica-danger);
}

.modelica-recorded-state[data-status="recovery_required"] .modelica-recorded-state-dot {
  background: var(--modelica-warning);
}

.modelica-back-button {
  min-height: 2rem;
  border-color: var(--modelica-border);
  background: transparent;
  color: var(--modelica-muted);
}

.modelica-back-button:hover {
  color: var(--modelica-text);
}

.spinner {
  width: 1.5rem;
  height: 1.5rem;
  border: 3px solid var(--modelica-border);
  border-top-color: var(--modelica-accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(1turn);
  }
}

@keyframes recorded-pulse {
  50% {
    opacity: 0.35;
  }
}

@container modelica-view (max-width: 440px) {
  .component-surface-host {
    padding: 0.55rem;
  }
  .modelica-component-only .component-surface-host {
    padding: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .spinner,
  .modelica-recorded-state[data-status="running"] .modelica-recorded-state-dot {
    animation: none;
  }
}

.mcp-view-surface,
.mcp-view-preact-surface,
.mcp-view-component {
  width: 100%;
  min-width: 0;
}

.mcp-view-surface,
.mcp-view-preact-surface {
  container-type: inline-size;
}

.mcp-view-card {
  min-width: 0;
  padding: 0.85rem;
  border: 1px solid var(--mcp-view-border);
  border-radius: var(--mcp-view-radius);
  background: var(--mcp-view-panel);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
}

.mcp-view-card-title {
  margin: 0 0 0.72rem;
  color: var(--mcp-view-muted);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.mcp-view-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.72rem;
}

.mcp-view-card-heading { min-width: 0; }

.mcp-view-card-header .mcp-view-card-title { margin: 0; }

.mcp-view-card-eyebrow {
  margin: 0 0 0.18rem;
  color: var(--mcp-view-accent);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.mcp-view-card-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 0.35rem;
  margin-left: auto;
}

.mcp-view-message,
.mcp-view-empty {
  color: var(--mcp-view-muted);
  font-size: 0.82rem;
}

.mcp-view-message {
  padding: 1rem;
  border: 1px dashed color-mix(in srgb, currentColor 25%, transparent);
  border-radius: 0.6rem;
}

.mcp-view-empty { margin: 0; }

.mcp-view-metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr));
  gap: 0.45rem;
}

.mcp-view-metric {
  display: grid;
  gap: 0.12rem;
  min-width: 0;
  padding: 0.65rem;
  border-radius: 0.55rem;
  background: var(--mcp-view-subtle);
}

.mcp-view-metric-label,
.mcp-view-metric-unit {
  color: var(--mcp-view-muted);
  font-size: 0.68rem;
}

.mcp-view-metric-value {
  overflow-wrap: anywhere;
  font-size: 1.1rem;
}

.mcp-view-metric[data-tone="info"] .mcp-view-metric-value { color: var(--mcp-view-accent); }
.mcp-view-metric[data-tone="success"] .mcp-view-metric-value { color: var(--mcp-view-success); }
.mcp-view-metric[data-tone="warning"] .mcp-view-metric-value { color: var(--mcp-view-warning); }
.mcp-view-metric[data-tone="danger"] .mcp-view-metric-value { color: var(--mcp-view-danger); }

.mcp-view-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}

.mcp-view-badge {
  padding: 0.2rem 0.45rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--mcp-view-muted) 12%, transparent);
  color: var(--mcp-view-muted);
  font-size: 0.68rem;
  font-weight: 700;
}

.mcp-view-badge[data-tone="info"] {
  background: color-mix(in srgb, var(--mcp-view-accent) 15%, transparent);
  color: var(--mcp-view-accent);
}

.mcp-view-badge[data-tone="success"] {
  background: color-mix(in srgb, var(--mcp-view-success) 15%, transparent);
  color: var(--mcp-view-success);
}

.mcp-view-badge[data-tone="warning"] {
  background: color-mix(in srgb, var(--mcp-view-warning) 15%, transparent);
  color: var(--mcp-view-warning);
}

.mcp-view-badge[data-tone="danger"] {
  background: color-mix(in srgb, var(--mcp-view-danger) 15%, transparent);
  color: var(--mcp-view-danger);
}

.mcp-view-table-wrap {
  max-width: 100%;
  overflow-x: auto;
}

.mcp-view-table {
  width: 100%;
  border-collapse: collapse;
  font: inherit;
  font-size: 0.76rem;
}

.mcp-view-table th,
.mcp-view-table td {
  padding: 0.48rem 0.42rem;
  border-bottom: 1px solid color-mix(in srgb, var(--mcp-view-border) 67%, transparent);
  text-align: left;
  white-space: nowrap;
}

.mcp-view-table [data-align="right"] { text-align: right; }

.mcp-view-table tbody tr[data-interactive="true"] { cursor: pointer; }
.mcp-view-table tbody tr[data-interactive="true"]:hover {
  background: color-mix(in srgb, var(--mcp-view-accent) 8%, transparent);
}
.mcp-view-table tbody tr[data-interactive="true"]:focus-visible {
  outline: 2px solid var(--mcp-view-accent);
  outline-offset: -2px;
}

.mcp-view-selected {
  background: color-mix(in srgb, var(--mcp-view-accent) 18%, transparent);
  outline: 1px solid color-mix(in srgb, var(--mcp-view-accent) 55%, transparent);
  outline-offset: -1px;
}

.mcp-view-cross-selection {
  display: flex;
  align-items: baseline;
  gap: 0.35rem;
  margin-bottom: 0.65rem;
  padding: 0.5rem 0.65rem;
  border: 1px solid color-mix(in srgb, var(--mcp-view-accent) 32%, transparent);
  border-radius: 0.5rem;
  background: color-mix(in srgb, var(--mcp-view-accent) 10%, transparent);
  color: var(--mcp-view-muted);
  font-size: 0.75rem;
}

.mcp-view-cross-selection-status {
  margin-left: auto;
  color: var(--mcp-view-warning);
}

.mcp-view-stack { display: grid; gap: 0.42rem; }

.mcp-view-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  min-width: 0;
  padding: 0.58rem;
  border-radius: 0.5rem;
  background: var(--mcp-view-subtle);
}

.mcp-view-key-values {
  display: grid;
  gap: 0.42rem;
  margin: 0;
}

.mcp-view-key-value {
  display: grid;
  grid-template-columns: minmax(7rem, auto) minmax(0, 1fr);
  gap: 0.75rem;
  padding: 0.58rem;
  border-radius: 0.5rem;
  background: var(--mcp-view-subtle);
}

.mcp-view-key-value dt {
  color: var(--mcp-view-muted);
  font-size: 0.7rem;
}

.mcp-view-key-value dd {
  min-width: 0;
  margin: 0;
  overflow-wrap: anywhere;
  text-align: right;
}

.mcp-view-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}

.mcp-view-button {
  min-height: 1.9rem;
  padding: 0.35rem 0.58rem;
  border: 1px solid var(--mcp-view-border);
  border-radius: 0.5rem;
  background: var(--mcp-view-subtle);
  color: var(--mcp-view-text);
  cursor: pointer;
  font: inherit;
  font-size: 0.72rem;
  font-weight: 650;
}

.mcp-view-button:not(:disabled):hover,
.mcp-view-button[aria-pressed="true"] {
  border-color: color-mix(in srgb, var(--mcp-view-accent) 58%, var(--mcp-view-border));
  color: var(--mcp-view-accent);
}

.mcp-view-button:focus-visible {
  border-color: var(--mcp-view-accent);
  color: var(--mcp-view-accent);
  outline: 2px solid var(--mcp-view-accent);
  outline-offset: 2px;
}

.mcp-view-button[aria-pressed="true"] {
  background: color-mix(in srgb, var(--mcp-view-accent) 13%, transparent);
}

.mcp-view-button:disabled { cursor: not-allowed; opacity: 0.5; }

.mcp-view-state {
  display: grid;
  gap: 0.3rem;
  min-height: 4rem;
  place-content: center;
  padding: 1rem;
  border: 1px dashed var(--mcp-view-border);
  border-radius: var(--mcp-view-radius);
  color: var(--mcp-view-muted);
  text-align: center;
}

.mcp-view-state[data-tone="success"] strong { color: var(--mcp-view-success); }
.mcp-view-state[data-tone="warning"] strong { color: var(--mcp-view-warning); }
.mcp-view-state[data-tone="danger"] strong { color: var(--mcp-view-danger); }
.mcp-view-state[data-tone="info"] strong { color: var(--mcp-view-accent); }

.mcp-view-state-detail { max-width: 48ch; }

@container (max-width: 440px) {
  .mcp-view-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mcp-view-row-responsive { align-items: flex-start; flex-direction: column; }
  .mcp-view-card-header { align-items: stretch; flex-direction: column; }
  .mcp-view-card-actions { justify-content: flex-start; }
  .mcp-view-key-value { grid-template-columns: 1fr; gap: 0.2rem; }
  .mcp-view-key-value dd { text-align: left; }
}
