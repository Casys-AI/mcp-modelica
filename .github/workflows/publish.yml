name: Publish JSR

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check out audited MCP View kit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Casys-AI/mcp-server
          ref: 8fad891839203122efbe2438ba81a6e7d08c9202
          path: .deps/mcp-server
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.6
      - name: Confirm tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          test "$TAG_NAME" = "v$version"
      - name: Rebuild and verify committed MCP Apps
        env:
          MCP_VIEW_MODULE: file://${{ github.workspace }}/.deps/mcp-server/packages/view/mod.ts
          MCP_VIEW_CONTRACTS_MODULE: file://${{ github.workspace }}/.deps/mcp-server/packages/view-contracts/mod.ts
          MCP_VIEW_COMPONENTS_MODULE: file://${{ github.workspace }}/.deps/mcp-server/packages/view-components/mod.ts
        run: |
          deno task build:ui
          git diff --exit-code -- src/ui/dist
      - name: Verify package
        run: |
          deno task check
          deno task fmt
          deno task lint
          deno task test
      - name: Build and verify the runtime image
        run: docker build --target final --tag mcp-modelica:runtime-check .
      - name: Verify the HTTP runtime entrypoint
        run: >-
          bash scripts/smoke-container-http.sh mcp-modelica:runtime-check
          "$(node -p 'require(\"./deno.json\").version')" 2.9.6
      - name: Verify the native stdio runtime entrypoint
        run: >-
          node scripts/smoke-container-stdio.mjs mcp-modelica:runtime-check
          "$(node -p 'require(\"./deno.json\").version')" 2.9.6
      - name: Publish package and provenance
        run: deno publish
