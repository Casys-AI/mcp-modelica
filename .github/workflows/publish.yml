name: Publish JSR

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.2
      - name: Confirm tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          test "$TAG_NAME" = "v$version"
      - name: Verify package
        run: |
          deno task check
          deno task fmt
          deno task lint
          deno task test
      - name: Build and verify the HTTP runtime image
        run: docker build --target final --tag mcp-modelica:runtime-check .
      - name: Verify the HTTP runtime entrypoint
        run: bash scripts/smoke-container-http.sh mcp-modelica:runtime-check
      - name: Publish package and provenance
        run: deno publish
