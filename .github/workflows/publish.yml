name: Publish JSR

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2
      - name: Verify package
        run: |
          deno task check
          deno task fmt
          deno task lint
          deno task test
      - name: Verify pinned OpenModelica environment
        run: docker build --target verify .
      - name: Publish package and provenance
        run: deno publish
