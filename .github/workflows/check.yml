name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deno:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.2
      - run: deno task check
      - run: deno task fmt
      - run: deno task lint
      - run: deno task test

  openmodelica-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Assert native AMD64 runner
        run: test "$(uname -m)" = x86_64
      - name: Build the native AMD64 final image
        run: docker build --target final --tag mcp-modelica:runtime-check .
      - name: Smoke the native AMD64 HTTP runtime
        run: >-
          bash scripts/smoke-container-http.sh mcp-modelica:runtime-check
          "$(node -p 'require("./deno.json").version')"

  openmodelica-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Assert native ARM64 runner
        run: test "$(uname -m)" = aarch64
      - name: Build the native ARM64 final image
        run: docker build --target final --tag mcp-modelica:runtime-check .
      - name: Smoke the native ARM64 HTTP runtime
        run: >-
          bash scripts/smoke-container-http.sh mcp-modelica:runtime-check
          "$(node -p 'require("./deno.json").version')"
