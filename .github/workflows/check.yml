name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.2
      - run: deno task check
      - run: deno task fmt
      - run: deno task lint
      - run: deno task test

  openmodelica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build verified runtime image
        run: docker build --target final --tag mcp-modelica:runtime-check .
      - name: Verify the HTTP runtime entrypoint
        run: bash scripts/smoke-container-http.sh mcp-modelica:runtime-check

  openmodelica-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - run: >-
          docker buildx build --platform linux/arm64 --target verify --provenance=false
          --build-arg OMC_INTEGRATION_TIMEOUT_MS=120000 .
