name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deno:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check out audited MCP View kit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Casys-AI/mcp-server
          ref: 59eeb3750d2049b8141b09d3a6f29f66f9d3c657
          path: .deps/mcp-server
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.6
      - name: Rebuild and verify committed MCP Apps
        env:
          MCP_VIEW_MODULE: file://${{ github.workspace }}/.deps/mcp-server/packages/view/mod.ts
          MCP_VIEW_CONTRACTS_MODULE: file://${{ github.workspace }}/.deps/mcp-server/packages/view-contracts/mod.ts
          MCP_VIEW_COMPONENTS_MODULE: file://${{ github.workspace }}/.deps/mcp-server/packages/view-components/mod.ts
        run: |
          deno task build:ui
          git diff --exit-code -- src/ui/dist
      - run: deno task check
      - run: deno task fmt
      - run: deno task lint
      - run: deno task test

  openmodelica-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Assert native AMD64 runner
        run: test "$(uname -m)" = x86_64
      - name: Build the native AMD64 final image
        run: docker build --target final --tag mcp-modelica:runtime-check .
      - name: Smoke the native AMD64 HTTP runtime
        run: >-
          bash scripts/smoke-container-http.sh mcp-modelica:runtime-check
          "$(node -p 'require("./deno.json").version')" 2.9.6
      - name: Smoke the native AMD64 stdio runtime
        run: >-
          node scripts/smoke-container-stdio.mjs mcp-modelica:runtime-check
          "$(node -p 'require("./deno.json").version')" 2.9.6

  openmodelica-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Assert native ARM64 runner
        run: test "$(uname -m)" = aarch64
      - name: Build the native ARM64 final image
        run: docker build --target final --tag mcp-modelica:runtime-check .
      - name: Smoke the native ARM64 HTTP runtime
        run: >-
          bash scripts/smoke-container-http.sh mcp-modelica:runtime-check
          "$(node -p 'require("./deno.json").version')" 2.9.6
      - name: Smoke the native ARM64 stdio runtime
        run: >-
          node scripts/smoke-container-stdio.mjs mcp-modelica:runtime-check
          "$(node -p 'require("./deno.json").version')" 2.9.6
